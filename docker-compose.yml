version: '3.1'

services:

  db:
    image: mysql
    restart: always
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: zdw
      MYSQL_PASSWORD: zdw
      MYSQL_ROOT_PASSWORD: zdw
      MYSQL_DATABASE: zdw-auth-service
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  default:

volumes:
  mysql_data: